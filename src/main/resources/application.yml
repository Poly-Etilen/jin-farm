spring:
  application:
    name: jinfarm

  # 로컬 개발 기본값: 인메모리 H2 (운영은 application-prod.yml)
  datasource:
    url: jdbc:h2:mem:jinfarm;MODE=PostgreSQL
  h2:
    console:
      enabled: true
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # 상태 페이지용: 구성 요소별 UP/DOWN만 공개 (상세 정보는 비공개)
      show-components: always
  info:
    env:
      enabled: true

# 배포된 커밋 (CD가 APP_COMMIT 환경변수로 주입)
info:
  app:
    commit: ${APP_COMMIT:local}
