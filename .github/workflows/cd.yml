# main에 push되면: 테스트 → 이미지 빌드(GHCR) → 집/농장 서버에 배포
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    needs: build
    # 서버 준비 전에는 건너뜀. 저장소 변수 DEPLOY_ENABLED=true 로 켠다
    if: vars.DEPLOY_ENABLED == 'true'
    # 서버에 설치한 self-hosted runner에서 실행 (라벨: jinfarm-prod)
    runs-on: [self-hosted, jinfarm-prod]
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ${{ needs.build.outputs.image }}
      APP_TAG: ${{ github.sha }}
      COMPOSE: docker compose -p jinfarm -f deploy/docker-compose.yml --env-file /opt/jinfarm/.env
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & restart
        run: |
          $COMPOSE pull app
          $COMPOSE up -d --remove-orphans

      - name: Health check
        run: |
          port=$(grep -E '^APP_PORT=' /opt/jinfarm/.env | cut -d= -f2)
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${port:-8080}/actuator/health" > /dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "health check failed"; $COMPOSE logs --tail=200 app; exit 1

      - name: Clean up old images
        if: always()
        run: docker image prune -f
